[project]
name = "pcketlm"
version = "0.1.0"
description = "Custom runtime and optimizer for dense local models on limited hardware."
requires-python = ">=3.12"
dependencies = [
    "safetensors",
    "tokenizers",
    "torch",
    "transformers",
]

[project.scripts]
pocketlm-web = "pcketlm.app.web.main:run"
pocketlm-supervisor = "pcketlm.app.chat_shell.supervisor_cli:main"
pocketlm-compatibility-proof = "pcketlm.app.chat_shell.compatibility_proof_cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

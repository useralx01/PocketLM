[project]
name = "pcketlm"
version = "0.1.0"
description = "Custom runtime and optimizer for dense local models on limited hardware."
requires-python = ">=3.12"
dependencies = [
    "safetensors",
    "tokenizers",
    "torch",
    "transformers",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
